<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг работы аэропортов РФ</title>
    <style>
        :root {
            --open-color: #2ecc71;        /* Зеленый */
            --pending-color: #f1c40f;     /* Желтый */
            --closed-color: #e74c3c;      /* Красный */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 2.2rem;
            color: #1e272e;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        /* Переключатель вкладок */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 10px 30px;
            border: none;
            background: #e2e8f0;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #2c3e50;
            color: white;
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.2);
        }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Стилизация карточки */
        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            border-top: 6px solid #bdc3c7;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        
        /* Цвета статусов (Границы) */
        .card.status-открыт { border-top-color: var(--open-color); }
        .card.status-согласование { border-top-color: var(--pending-color); }
        .card.status-закрыт { border-top-color: var(--closed-color); }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            color: #2c3e50;
        }

        /* Плашки статусов */
        .status-badge {
            align-self: flex-start;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-открыт .status-badge { background: #e8f8f0; color: #27ae60; }
        .status-согласование .status-badge { background: #fef9e7; color: #d4ac0d; }
        .status-закрыт .status-badge { background: #fdedec; color: #c0392b; }
        
        /* Время по Москве */
        .time-info {
            font-size: 0.85rem;
            color: #95a5a6;
            margin-top: 20px;
            border-top: 1px dashed #ecf0f1;
            padding-top: 10px;
        }
        .time-info strong {
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>Аэропорты</h1>
        <div class="subtitle" id="live-indicator">Автообновление каждую минуту • Синхронизация с Росавиацией</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all')">Все</button>
        <button class="tab-btn" onclick="switchTab('msk')">МСК</button>
    </div>

    <div class="grid" id="airports-grid">
        <!-- Карточки будут создаваться здесь автоматически -->
    </div>

    <script>
        // Список строго московских аэропортов для фильтрации
        const mskAirports = ['Шереметьево', 'Внуково', 'Домодедово', 'Жуковский (Раменское)'];
        let currentTab = 'all';
        let airportsData = [];

        // Загрузка статусов из созданного роботом JSON-файла
        async function loadAirportsStatus() {
            try {
                // Извлекаем актуальный файл status.json, лежащий в том же репозитории
                const response = await fetch('./status.json?nocache=' + new Date().getTime());
                const data = await response.json();
                
                airportsData = data.airports || [];
                renderCards();
                
                // Визуальный индикатор успешного обновления для пользователя
                document.getElementById('live-indicator').innerText = `Последнее обновление данных: ${new Date().toLocaleTimeString('ru-RU')} МСК`;
            } catch (error) {
                console.error("Не удалось загрузить данные о статусах:", error);
                document.getElementById('live-indicator').innerText = "Ошибка обновления данных. Проверьте соединение.";
            }
        }

        // Отрисовка карточек на экране
        function renderCards() {
            const grid = document.getElementById('airports-grid');
            grid.innerHTML = '';

            // Фильтруем массив в зависимости от выбранной вкладки
            const filtered = airportsData.filter(ap => {
                if (currentTab === 'msk') {
                    return mskAirports.includes(ap.name);
                }
                return true; // Во вкладку "Все" попадают абсолютно все города
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #7f8c8d;">Нет активных данных по выбранным аэропортам</div>';
                return;
            }

            // Создаем карточки динамически
            filtered.forEach(ap => {
                // Нормализуем имя класса для стилей, если статус "по согласованию"
                const statusClass = ap.status === 'по согласованию' ? 'согласование' : ap.status;
                
                const card = document.createElement('div');
                card.className = `card status-${statusClass}`;
                
                card.innerHTML = `
                    <div>
                        <h3>${ap.name}</h3>
                        <span class="status-badge">${ap.status}</span>
                    </div>
                    <div class="time-info">
                        Статус изменен: <strong>${ap.time}</strong>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Переключение вкладок "Все" / "МСК"
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards();
        }

        // Первая загрузка при открытии сайта
        loadAirportsStatus();

        // Автоматический перезапуск функции каждые 60 секунд (60000 миллисекунд)
        setInterval(loadAirportsStatus, 60000);
    </script>
</body>
</html>
